[project]
name = "dh"
version = "1.0.0"
description = "Domain ontology engine for danielhunt.dev — generic CRUD and protocol lint over the docs/ domain model."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0.1"]

[project.scripts]
dh = "dh.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
